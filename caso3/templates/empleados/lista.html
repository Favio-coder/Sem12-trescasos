{% extends 'base.html' %}{% block content %}<h1>Empleados</h1><div class="table-responsive"><table class="table table-striped"><thead><tr><th>DNI</th><th>Nombre</th><th>Cargo</th><th>Área</th><th>Estado</th></tr></thead><tbody>{% for e in empleados %}<tr><td>{{ e.dni }}</td><td>{{ e.nombre_completo }}</td><td>{{ e.cargo }}</td><td>{{ e.area }}</td><td>{{ e.activo|yesno:'Activo,Inactivo' }}</td></tr>{% empty %}<tr><td colspan="5">Sin empleados visibles.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
