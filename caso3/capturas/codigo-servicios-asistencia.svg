<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760"><rect width="1100" height="760" fill="#0d1726"/><rect width="1100" height="48" fill="#17283d"/><circle cx="24" cy="24" r="7" fill="#ef6a68"/><circle cx="48" cy="24" r="7" fill="#efb95d"/><circle cx="72" cy="24" r="7" fill="#6fc28b"/><text x="100" y="30" font-family="sans-serif" font-size="17" fill="white">caso3 / asistencias / services.py · snapshot del código fuente</text><text x="28" y="82" font-family="monospace" font-size="15" fill="#dbeafe">01  from datetime import datetime, timedelta</text><text x="28" y="105" font-family="monospace" font-size="15" fill="#dbeafe">02  from django.core.exceptions import ValidationError</text><text x="28" y="128" font-family="monospace" font-size="15" fill="#dbeafe">03  from django.db import transaction</text><text x="28" y="151" font-family="monospace" font-size="15" fill="#dbeafe">04  from django.utils import timezone</text><text x="28" y="174" font-family="monospace" font-size="15" fill="#dbeafe">05  from .models import Asistencia</text><text x="28" y="197" font-family="monospace" font-size="15" fill="#dbeafe">06  </text><text x="28" y="220" font-family="monospace" font-size="15" fill="#dbeafe">07  def validar_horario(empleado, ahora):</text><text x="28" y="243" font-family="monospace" font-size="15" fill="#dbeafe">08      inicio=datetime.combine(ahora.date(),empleado.area.hora_entrada).replace(tzinfo=timezone.get_current_timezone())</text><text x="28" y="266" font-family="monospace" font-size="15" fill="#dbeafe">09      fin=datetime.combine(ahora.date(),empleado.area.hora_salida).replace(tzinfo=timezone.get_current_timezone())</text><text x="28" y="289" font-family="monospace" font-size="15" fill="#dbeafe">10      if ahora &lt; inicio-timedelta(hours=2) or ahora &gt; fin+timedelta(hours=2): raise ValidationError(&#x27;Marcación fuera del horario permitido (±2 horas).&#x27;)</text><text x="28" y="312" font-family="monospace" font-size="15" fill="#dbeafe">11  </text><text x="28" y="335" font-family="monospace" font-size="15" fill="#dbeafe">12  def marcar_entrada(empleado, ahora=None):</text><text x="28" y="358" font-family="monospace" font-size="15" fill="#dbeafe">13      ahora=ahora or timezone.localtime()</text><text x="28" y="381" font-family="monospace" font-size="15" fill="#dbeafe">14      validar_horario(empleado,ahora)</text><text x="28" y="404" font-family="monospace" font-size="15" fill="#dbeafe">15      with transaction.atomic():</text><text x="28" y="427" font-family="monospace" font-size="15" fill="#dbeafe">16          if Asistencia.objects.select_for_update().filter(empleado=empleado,fecha=ahora.date(),hora_entrada__isnull=False).exists(): raise ValidationError(&#x27;Ya existe una entrada registrada hoy.&#x27;)</text><text x="28" y="450" font-family="monospace" font-size="15" fill="#dbeafe">17          item,created=Asistencia.objects.get_or_create(empleado=empleado,fecha=ahora.date(),defaults={&#x27;hora_entrada&#x27;:ahora.time().replace(tzinfo=None)})</text><text x="28" y="473" font-family="monospace" font-size="15" fill="#dbeafe">18          if not created: raise ValidationError(&#x27;Ya existe una marcación hoy.&#x27;)</text><text x="28" y="496" font-family="monospace" font-size="15" fill="#dbeafe">19          item.save();return item</text><text x="28" y="519" font-family="monospace" font-size="15" fill="#dbeafe">20  </text><text x="28" y="542" font-family="monospace" font-size="15" fill="#dbeafe">21  def marcar_salida(empleado, ahora=None):</text><text x="28" y="565" font-family="monospace" font-size="15" fill="#dbeafe">22      ahora=ahora or timezone.localtime()</text><text x="28" y="588" font-family="monospace" font-size="15" fill="#dbeafe">23      validar_horario(empleado,ahora)</text><text x="28" y="611" font-family="monospace" font-size="15" fill="#dbeafe">24      with transaction.atomic():</text><text x="28" y="634" font-family="monospace" font-size="15" fill="#dbeafe">25          item=Asistencia.objects.select_for_update().filter(empleado=empleado,fecha=ahora.date(),hora_entrada__isnull=False,hora_salida__isnull=True).first()</text><text x="28" y="657" font-family="monospace" font-size="15" fill="#dbeafe">26          if not item: raise ValidationError(&#x27;No hay una entrada abierta para hoy.&#x27;)</text></svg>