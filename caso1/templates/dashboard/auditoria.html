{% extends 'base.html' %}{% block content %}
<h1>Auditoría</h1>
<table class="table">
  <tr>
    <th>Fecha</th>
    <th>Usuario</th>
    <th>Acción</th>
    <th>IP</th>
    <th>Recurso</th>
    <th>Detalle</th>
  </tr>
  {% for x in eventos %}
  <tr>
    <td>{{ x.fecha_hora }}</td>
    <td>{{ x.usuario|default:'-' }}</td>
    <td>{{ x.accion }}</td>
    <td>{{ x.direccion_ip }}</td>
    <td>{{ x.recurso }}</td>
    <td>{{ x.descripcion }}</td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
